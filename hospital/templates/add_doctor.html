{% extends 'navigationbar.html' %}
{% load static %}

{% block body %}

{% if msg == 'added' %}
<script>
    Swal.fire({
        icon: 'success',
        title: 'Doctor Added!',
        text: 'The doctor has been successfully added.',
        timer: 2000,
        showConfirmButton: false
    }).then(() => {
        window.location.href = "{% url 'view_doctor' %}";
    });
</script>
{% endif %}

<div class="container" style="margin-top: 60px; margin-bottom: 60px;">
    
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg" style="border-radius: 32px; overflow: hidden;">
                
                <div class="card-header text-center" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 1.5rem; border: none;">
                    <i class="fas fa-user-md" style="font-size: 2rem;"></i>
                    <h2 class="mt-2 mb-0" style="font-weight: 700;">Add New Doctor</h2>
                    <p class="mb-0">Register a medical professional</p>
                </div>
                
                <div class="card-body" style="padding: 2rem;">
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Doctor Name</label>
                            <input type="text" class="form-control" name="name" placeholder="Dr. John Doe" required>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-phone"></i> Mobile Number</label>
                            <input type="text" class="form-control" name="mobile" placeholder="+92 300 1234567" required>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-stethoscope"></i> Specialization</label>
                            <input type="text" class="form-control" name="special" placeholder="Cardiologist, Neurologist, etc." required>
                        </div>
                        
                        <hr class="my-4">
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save"></i> Add Doctor
                            </button>
                            <a href="{% url 'view_doctor' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left"></i> Cancel & Go Back
                            </a>
                        </div>
                        
                    </form>
                    
                </div>
                
            </div>
        </div>
    </div>
    
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

{% endblock %}
